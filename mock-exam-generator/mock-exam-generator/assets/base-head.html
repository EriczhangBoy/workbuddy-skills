<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="docx-page-size" content="A4">
<title>{TITLE}</title>
<style>
@page {
  @bottom-center { content: counter(page); }
}
@page cover {
  @bottom-center { content: none; }
}
section[role="cover"] { page: cover; }

:root {
  /* ===== Design Tokens：business-modern（design-token skill 预编译产物） ===== */
  /* 中文字体按用户要求采用思源宋体 / 思源黑体系列，并保留系统回退 */
  --typography-fontFamily-heading: "思源黑体","Source Han Sans SC","Noto Sans CJK SC","微软雅黑","Microsoft YaHei",sans-serif;
  --typography-fontFamily-body: "思源宋体","Source Han Serif SC","Noto Serif CJK SC","宋体","SimSun",serif;
  --typography-fontSize-title: 28pt;
  --typography-fontSize-h1: 20pt;
  --typography-fontSize-h2: 11pt;
  --typography-fontSize-h3: 10pt;
  --typography-fontSize-body: 9pt;
  --typography-fontSize-small: 8pt;
  --typography-lineHeight-body: 1.6;
  --typography-lineHeight-compact: 1.2;
  --typography-fontWeight-heading: 600;
  --typography-fontWeight-body: 400;
  --color-primary: #1565C0;
  --color-secondary: #0288D1;
  --color-accent: #00897B;
  --color-text: #212121;
  --color-textSecondary: #616161;
  --color-heading: #1A237E;
  --color-divider: #E0E0E0;
  --color-background: #FFFFFF;
  --color-surface: #F5F7FA;
  --spacing-paragraph: 0.75em;
  --spacing-sectionGap: 2.5em;
  --spacing-cardPadding: 1.5em;
  --layout-marginTop: 2.5cm;
  --layout-marginBottom: 2.0cm;
  --layout-marginLeft: 2.5cm;
  --layout-marginRight: 2.5cm;
  --layout-maxContentWidth: 160mm;

  /* ===== 本地语义别名 ===== */
  --fs-title: var(--typography-fontSize-title);
  --fs-h1: var(--typography-fontSize-h1);
  --fs-h2: var(--typography-fontSize-h2);
  --fs-h3: var(--typography-fontSize-h3);
  --fs-h4: var(--typography-fontSize-h3);
  --fs-body: var(--typography-fontSize-body);
  --fs-question: var(--typography-fontSize-h3);
  --fs-small: var(--typography-fontSize-small);
  --ff-heading: var(--typography-fontFamily-heading);
  --ff-body: var(--typography-fontFamily-body);
  --lh-body: var(--typography-lineHeight-body);
  --lh-compact: var(--typography-lineHeight-compact);
  --fw-heading: var(--typography-fontWeight-heading);
  --fw-normal: var(--typography-fontWeight-body);
  --color-muted: var(--color-textSecondary);
  --color-emphasis: var(--color-primary);
  --margin-page: var(--layout-marginTop);
  --page-content-width: var(--layout-maxContentWidth);
  --radius-card: 4px;
  --shadow-card: 0 2px 8px rgba(0,0,0,0.08);
  --spacing-list-indent: 1.6em;
  --spacing-option: 0.15em;
  --spacing-qgap: 0.5em;
  --spacing-qblock: 0.45em;
  --spacing-tight: 0.2em;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { background: var(--color-bg); }

body {
  font-family: var(--ff-body);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--color-text);
  background: var(--color-bg);
  max-width: var(--page-content-width);
  margin-left: auto;
  margin-right: auto;
  padding: 0;
}

section { margin: 0; }

/* ===== 标题 ===== */
h1, h2, h3, h4 {
  font-family: var(--ff-heading);
  color: var(--color-heading);
  line-height: var(--lh-compact);
}
h1 {
  font-size: var(--fs-h1);
  font-weight: var(--fw-heading);
  margin: 0 0 var(--spacing-paragraph);
}
h2 {
  font-size: var(--fs-h2);
  font-weight: var(--fw-heading);
  color: var(--color-primary);
  margin: var(--spacing-section) 0 var(--spacing-paragraph);
  border-bottom: 1px solid var(--color-divider);
  padding-bottom: var(--spacing-tight);
}
h3 {
  font-size: var(--fs-h3);
  font-weight: var(--fw-heading);
  margin: var(--spacing-block) 0 var(--spacing-paragraph);
}
h4 {
  font-size: var(--fs-h4);
  font-weight: var(--fw-heading);
  color: var(--color-primary);
  margin: var(--spacing-block) 0 var(--spacing-paragraph);
}
.set-heading {
  background: var(--color-surface);
  padding: var(--spacing-tight) var(--spacing-paragraph);
  border-bottom: none;
}

/* ===== 段落 ===== */
p {
  font-family: var(--ff-body);
  font-size: var(--fs-body);
  color: var(--color-text);
  line-height: var(--lh-body);
  margin: 0 0 var(--spacing-paragraph);
}
.section-lead, .set-lead, .part-lead { color: var(--color-muted); }
.footnote { font-size: var(--fs-small); color: var(--color-muted); }
.summary-badge { font-style: italic; color: var(--color-muted); font-size: var(--fs-small); font-weight: var(--fw-normal); }

/* ===== 封面 ===== */
.cover { min-height: 42vh; padding: var(--spacing-section) 0; }
.cover-eyebrow {
  font-family: var(--ff-heading);
  font-size: var(--fs-h3);
  font-weight: var(--fw-heading);
  color: var(--color-secondary);
  letter-spacing: 0.05em;
  margin-bottom: var(--spacing-block);
}
.cover-title {
  font-family: var(--ff-heading);
  font-size: var(--fs-title);
  font-weight: var(--fw-heading);
  color: var(--color-primary);
  margin: 0 0 var(--spacing-paragraph);
}
.cover-subtitle {
  font-family: var(--ff-heading);
  font-size: var(--fs-h2);
  color: var(--color-muted);
  margin: 0 0 var(--spacing-block);
}
.cover-meta { margin: 0 0 var(--spacing-tight); }
.cover-note {
  font-size: var(--fs-small);
  color: var(--color-muted);
  margin: var(--spacing-block) 0 0;
}

/* ===== 目录 ===== */
.doc-toc {
  margin: 0 0 var(--spacing-section);
  padding: var(--spacing-block);
  background: var(--color-surface);
  border-radius: var(--radius-card);
}
.toc-title {
  font-family: var(--ff-heading);
  font-size: var(--fs-h2);
  font-weight: var(--fw-heading);
  color: var(--color-primary);
  margin: 0 0 var(--spacing-paragraph);
}
.toc-list {
  list-style: decimal;
  padding-left: var(--spacing-list-indent);
  margin: 0;
}
.toc-list li {
  font-family: var(--ff-body);
  font-size: var(--fs-body);
  color: var(--color-text);
  margin: 0 0 var(--spacing-option);
}
.toc-list a { color: var(--color-primary); text-decoration: none; }

/* ===== 编制说明（执行摘要） ===== */
.executive-summary { margin: 0 0 var(--spacing-section); }
.summary-body p:last-child { margin-bottom: 0; }

/* ===== 列表 ===== */
ul, ol { margin: 0 0 var(--spacing-paragraph); padding-left: var(--spacing-list-indent); }
li {
  font-family: var(--ff-body);
  font-size: var(--fs-question);
  color: var(--color-text);
  line-height: var(--lh-body);
  margin: 0 0 var(--spacing-option);
}
.job-list li { font-size: var(--fs-body); }

/* ===== 题目 ===== */
.question { margin: 0 0 var(--spacing-qgap); }
.q-line {
  font-family: var(--ff-body);
  font-size: var(--fs-question);
  color: var(--color-text);
  line-height: var(--lh-body);
  margin: 0 0 var(--spacing-tight);
}
.q-no { font-weight: var(--fw-heading); color: var(--color-heading); margin-right: var(--spacing-option); }
.q-badge {
  font-family: var(--ff-heading);
  font-size: var(--fs-small);
  font-weight: var(--fw-heading);
  margin-right: var(--spacing-option);
}
.q-single { color: var(--color-primary); }
.q-multi { color: var(--color-accent); }
.options {
  list-style: none;
  margin: 0 0 var(--spacing-qblock);
  padding-left: var(--spacing-list-indent);
}
.options li { margin-bottom: var(--spacing-option); }
.opt-key { font-weight: var(--fw-heading); color: var(--color-primary); margin-right: var(--spacing-tight); }
.q-sub { color: var(--color-textSecondary); font-size: var(--fs-small); }

/* ===== 表格 ===== */
table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 var(--spacing-block);
}
caption {
  font-family: var(--ff-heading);
  font-size: var(--fs-small);
  font-weight: var(--fw-heading);
  color: var(--color-muted);
  text-align: left;
  margin: 0 0 var(--spacing-tight);
}
th, td {
  border: 1px solid var(--color-divider);
  padding: var(--spacing-tight) var(--spacing-paragraph);
  font-family: var(--ff-body);
  font-size: var(--fs-small);
  color: var(--color-text);
  line-height: var(--lh-body);
  text-align: left;
  vertical-align: top;
}
th {
  background: var(--color-surface);
  color: var(--color-heading);
  font-weight: var(--fw-heading);
}
.ans {
  text-align: center;
  font-weight: var(--fw-heading);
  color: var(--color-accent);
}
.qid { text-align: center; color: var(--color-textSecondary); }

/* ===== callout ===== */
[data-component="callout"] {
  font-family: var(--ff-body);
  font-size: var(--fs-body);
  color: var(--color-text);
  line-height: var(--lh-body);
  padding: var(--spacing-block);
  margin: 0 0 var(--spacing-block);
  border-radius: var(--radius-card);
  border-left: 4px solid var(--color-secondary);
  background: var(--color-surface);
}
[data-component="callout"][data-variant="info"] {
  border-left-color: var(--color-secondary);
  background: var(--color-surface);
}
[data-component="callout"][data-variant="warning"] {
  border-left-color: var(--color-accent);
  background: var(--color-surface);
}
</style>
</head>
